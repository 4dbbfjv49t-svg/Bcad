name: build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          sw_vers
          sysctl -n machdep.cpu.brand_string hw.ncpu
          xcode-select -p
          xcrun --sdk macosx --show-sdk-path
          swiftc --version
          clang++ --version
          ls -la /Library/Developer/CommandLineTools/SDKs || echo "no Command Line Tools SDKs"
          if ! ls -d /Library/Developer/CommandLineTools/SDKs/MacOSX26*.sdk >/dev/null 2>&1; then
            echo "build.sh needs a Command Line Tools macOS 26 SDK; linking the Xcode one there"
            sudo mkdir -p /Library/Developer/CommandLineTools/SDKs
            sudo ln -s "$(xcrun --sdk macosx --show-sdk-path)" /Library/Developer/CommandLineTools/SDKs/MacOSX26.sdk
          fi
          ls -la /Library/Developer/CommandLineTools/SDKs

      - name: Restore OpenCascade
        id: occt
        uses: actions/cache/restore@v4
        with:
          path: Vendor/occt
          key: occt-${{ runner.arch }}-${{ hashFiles('occt.sh') }}

      - name: Build OpenCascade
        run: |
          mkdir -p Vendor  # occt.sh expects Vendor/ to exist
          start=$(date +%s)
          ./occt.sh
          echo "occt.sh took $(( $(date +%s) - start )) s"

      - name: Save OpenCascade
        if: steps.occt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Vendor/occt
          key: occt-${{ runner.arch }}-${{ hashFiles('occt.sh') }}

      - name: Self-test
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          start=$(date +%s)
          ./test/selftest.sh 2>&1 | tee "$RUNNER_TEMP/results/selftest.log"
          echo "self-test took $(( $(date +%s) - start )) s"

      - name: Build app
        run: |
          start=$(date +%s)
          ./build.sh "$RUNNER_TEMP/out/Bcad.app"
          echo "build took $(( $(date +%s) - start )) s"
          ls -la "$RUNNER_TEMP/out/Bcad.app/Contents" "$RUNNER_TEMP/out/Bcad.app/Contents/MacOS"
          codesign -dv "$RUNNER_TEMP/out/Bcad.app" 2>&1 || true
          codesign --verify --strict "$RUNNER_TEMP/out/Bcad.app" && echo "signature ok" || echo "signature NOT valid"
          ditto -c -k --keepParent "$RUNNER_TEMP/out/Bcad.app" "$RUNNER_TEMP/out/Bcad.app.zip"

      - name: Launch and open a file
        continue-on-error: true
        run: |
          APP="$RUNNER_TEMP/out/Bcad.app"
          FILE="$TMPDIR/bcad-selftest/test.3mf"
          R="$RUNNER_TEMP/results"
          mkdir -p "$R/shots"
          ls -la "$FILE" || echo "no test.3mf from the self-test"
          snap() {
            sleep "$2"
            screencapture -x "$R/shots/$1.png" || echo "screencapture failed"
            if pgrep -x Bcad >/dev/null; then echo "$1: Bcad running"; else echo "$1: Bcad NOT running"; fi
          }
          quit() {
            pkill -TERM -x Bcad || true
            for i in $(seq 1 50); do pgrep -x Bcad >/dev/null || break; sleep 0.2; done
            pkill -KILL -x Bcad 2>/dev/null || true
          }

          echo "▸ 1 launch empty"
          open --stdout "$R/1.out" --stderr "$R/1.err" "$APP"
          snap 1-empty 15

          echo "▸ 2 open the file in the running app"
          open -a "$APP" "$FILE"
          snap 2-open-running-10s 10
          snap 2-open-running-40s 30
          quit

          echo "▸ 3 cold launch with the file (Finder double-click)"
          open -a "$APP" --stdout "$R/3.out" --stderr "$R/3.err" "$FILE"
          snap 3-cold-10s 10
          snap 3-cold-40s 30

          echo "▸ 4 open the same file again"
          open -a "$APP" "$FILE"
          snap 4-reopen-30s 30
          quit

          log show --last 15m --style compact --predicate 'process == "Bcad"' > "$R/unified.log" 2>&1 || true
          tail -100 "$R/unified.log"
          mkdir -p "$R/crashes"
          cp ~/Library/Logs/DiagnosticReports/*Bcad* "$R/crashes/" 2>/dev/null || echo "no crash reports"
          ls -la "$R" "$R/shots" "$R/crashes"
          for f in "$R"/*.out "$R"/*.err; do echo "── $f"; cat "$f"; done

      - name: Open-file probe
        continue-on-error: true
        run: |
          # Builds the app's own sources with a probe in place of test/SelfTest.swift (same --selftest hook) and drives
          # Workbench.open the way the app does, printing what the viewport would get.
          W="$RUNNER_TEMP/probe"
          mkdir -p "$W"
          cat > "$W/OpenProbe.swift" <<'SWIFT'
          #if SELFTEST
          import AppKit
          import Metal
          import simd

          @MainActor
          enum SelfTest {
              static func run(_ url: URL) -> Bool {
                  setvbuf(stdout, nil, _IONBF, 0)
                  _ = NSApplication.shared
                  let lib = Workbench.shared
                  let renderer: Renderer? = MTLCreateSystemDefaultDevice() == nil ? nil : Renderer()
                  print("Metal device: \(renderer != nil)")
                  var ok = true

                  func settle(_ limit: Double = 240) {
                      let end = Date().addingTimeInterval(limit)
                      while Date() < end {
                          RunLoop.main.run(until: Date().addingTimeInterval(0.05))
                          if !lib.building && lib.doc.bodies.allSatisfy({ lib.meshes[$0.id] != nil }) { break }
                      }
                      RunLoop.main.run(until: Date().addingTimeInterval(0.3))
                  }

                  func report(_ title: String) {
                      print("== \(title)")
                      print("   bodies \(lib.doc.bodies.count) · building \(lib.building) · mode \(lib.mode) · angleEdit \(lib.angleEdit != nil) · selection \(lib.selection.count) · dirty \(lib.dirty) · requestFit \(lib.requestFit)")
                      if let r = renderer, lib.requestFit, r.fit() { lib.requestFit = false }
                      let f = renderer?.frame(CGSize(width: 1000, height: 820))
                      let visible = lib.doc.bodies.filter { !$0.hidden }
                      var drawn = 0
                      for b in lib.doc.bodies {
                          guard let m = lib.meshes[b.id] else { print("   \(b.name): NO MESH"); continue }
                          var inView = "?"
                          if let f, let (lo, hi) = lib.worldBounds(b) {
                              let c = f.viewProj * SIMD4<Float>(SIMD3<Float>((lo + hi) / 2), 1)
                              let ndc = SIMD3(c.x, c.y, c.z) / c.w
                              inView = c.w > 0 && abs(ndc.x) <= 1 && abs(ndc.y) <= 1 && ndc.z >= 0 && ndc.z <= 1 ? "yes" : "NO \(ndc)"
                          }
                          if !m.vertices.isEmpty && !b.hidden { drawn += 1 }
                          print("   \(b.name): hidden \(b.hidden) · \(m.vertices.count) verts · \(m.indices.count / 3) tris · valid \(m.valid) · vol \(String(format: "%.1f", m.volume)) · centre in view \(inView)")
                      }
                      print("   camera target \(lib.camera.target) distance \(lib.camera.distance) · drawable bodies \(drawn)/\(visible.count)")
                      if drawn < visible.count { ok = false; print("   ✗ visible bodies with nothing to draw") }
                      if lib.angleEdit != nil { ok = false; print("   ✗ the angle editor still covers the viewport and hides the tools") }
                  }

                  lib.rebuildScene()
                  settle(10)
                  report("launch, empty")

                  let t0 = Date()
                  lib.open(url)
                  report("right after open")
                  settle()
                  report(String(format: "after the build (%.1f s)", Date().timeIntervalSince(t0)))
                  let first = lib.doc.bodies.map { lib.meshes[$0.id]?.vertices.count ?? -1 }

                  lib.open(url)
                  settle()
                  report("same file opened again")

                  lib.dirty = false
                  lib.newDocument()
                  settle(5)
                  lib.open(url)
                  lib.open(url)
                  settle()
                  report("opened twice in a row, the second while the first builds")
                  if lib.doc.bodies.map({ lib.meshes[$0.id]?.vertices.count ?? -1 }) != first { ok = false; print("   ✗ meshes differ from the first open") }

                  if let b = lib.doc.bodies.first {
                      lib.selection = [b.id]
                      lib.choose(.angles)
                      lib.edgePicks = [Pick(kind: Int32(BK_PICK_BODY), a: .zero, b: .zero)]
                      lib.workWithAngles()
                      let end = Date().addingTimeInterval(20)
                      while lib.angleEdit == nil && Date() < end { RunLoop.main.run(until: Date().addingTimeInterval(0.05)) }
                      print("== angle editor open before the next open: \(lib.angleEdit != nil)")
                      lib.open(url)
                      settle()
                      report("opened while the angle editor was open")
                  }

                  lib.dirty = false
                  lib.newDocument()
                  lib.open(url)
                  settle()
                  if let b = lib.doc.bodies.first { lib.selection = [b.id] }
                  lib.enter(.hollow)
                  lib.open(url)
                  settle()
                  report("opened while in Hollow mode")

                  print(ok ? "PROBE OK" : "PROBE FOUND PROBLEMS")
                  return ok
              }
          }
          #endif
          SWIFT
          SDK="$(ls -d /Library/Developer/CommandLineTools/SDKs/MacOSX26*.sdk | tail -1)"
          OCCT="$PWD/Vendor/occt"
          clang++ -O2 -std=c++17 -isysroot "$SDK" -target arm64-apple-macos26.0 -w -I "$OCCT/include/opencascade" -c BcadKernel.cpp -o "$W/k.o"
          LIBS=(); for f in "$OCCT"/lib/*.a; do LIBS+=(-Xlinker "$f"); done
          swiftc -O -swift-version 5 -parse-as-library -sdk "$SDK" -target arm64-apple-macos26.0 -D SELFTEST -import-objc-header BcadKernel.h \
            Bcad.swift Design.swift Viewport.swift Views.swift Files.swift "$W/OpenProbe.swift" "$W/k.o" "${LIBS[@]}" -lc++ -o "$W/probe"
          APP_STRINGS="$PWD/i18n.json" perl -e 'alarm 900; exec @ARGV' "$W/probe" --selftest "$TMPDIR/bcad-selftest/test.3mf" 2>&1 | tee "$RUNNER_TEMP/results/probe.log"

      - name: Viewport probe
        continue-on-error: true
        run: |
          # Hosts the real interface in a window, counts the 3D view's frames around opening a file, and tries a mouse
          # drag on the 3D view to see whether that brings the model back. Screenshots go to results/shots/probe-*.
          W="$RUNNER_TEMP/probe"
          cat > "$W/ViewProbe.swift" <<'SWIFT'
          #if SELFTEST
          import AppKit
          import MetalKit
          import SwiftUI

          @MainActor
          final class Spy: NSObject, MTKViewDelegate {
              let inner: Renderer
              var frames = 0, early = 0
              init(_ r: Renderer) { inner = r }
              nonisolated func mtkView(_ view: MTKView, drawableSizeWillChange size: CGSize) {}
              nonisolated func draw(in view: MTKView) {
                  MainActor.assumeIsolated {
                      frames += 1
                      if view.currentRenderPassDescriptor == nil { early += 1 }
                  }
                  inner.draw(in: view)
              }
          }

          @MainActor
          enum SelfTest {
              static func run(_ url: URL) -> Bool {
                  setvbuf(stdout, nil, _IONBF, 0)
                  let app = NSApplication.shared
                  app.setActivationPolicy(.regular)
                  let lib = Workbench.shared
                  let shots = ProcessInfo.processInfo.environment["SHOTS"] ?? "/tmp"
                  var window: NSWindow?
                  var spy: Spy?

                  func pump(_ s: Double) { RunLoop.main.run(until: Date().addingTimeInterval(s)) }
                  func settle() {
                      let end = Date().addingTimeInterval(240)
                      repeat { pump(0.1) } while (lib.building || lib.doc.bodies.contains { lib.meshes[$0.id] == nil }) && Date() < end
                      pump(2)
                  }
                  func find(_ v: NSView) -> CadView? { (v as? CadView) ?? v.subviews.lazy.compactMap(find).first }
                  func show() {
                      let w = NSWindow(contentRect: NSRect(x: 80, y: 80, width: 1320, height: 820), styleMask: [.titled, .closable, .resizable], backing: .buffered, defer: false)
                      w.contentView = NSHostingView(rootView: RootView().environment(lib).frame(minWidth: 1000, minHeight: 600).skinEnvironment())
                      w.makeKeyAndOrderFront(nil)
                      app.activate(ignoringOtherApps: true)
                      window = w
                      pump(0.5)
                      if let cad = find(w.contentView!) {
                          let s = Spy(cad.renderer)
                          cad.delegate = s
                          spy = s
                          cad.needsDisplay = true
                      } else {
                          print("✗ no 3D view found")
                      }
                      pump(2)
                  }
                  func shot(_ name: String) {
                      let p = Process()
                      p.executableURL = URL(fileURLWithPath: "/usr/sbin/screencapture")
                      p.arguments = ["-x", "\(shots)/probe-\(name).png"]
                      try? p.run()
                      p.waitUntilExit()
                  }
                  func state(_ title: String) {
                      let drawable = lib.doc.bodies.filter { !$0.hidden && !(lib.meshes[$0.id]?.vertices.isEmpty ?? true) }.count
                      print("== \(title): frames \(spy?.frames ?? -1) (\(spy?.early ?? -1) without a drawable) · bodies \(lib.doc.bodies.count), with meshes \(drawable) · building \(lib.building) · requestFit \(lib.requestFit) · camera \(lib.camera.target) d \(lib.camera.distance)")
                      shot(title.replacingOccurrences(of: " ", with: "-"))
                  }
                  func drag() {
                      guard let w = window, let cad = find(w.contentView!) else { return }
                      let c = cad.convert(NSPoint(x: cad.bounds.midX, y: cad.bounds.midY), to: nil)
                      func ev(_ t: NSEvent.EventType, _ dx: CGFloat) -> NSEvent {
                          NSEvent.mouseEvent(with: t, location: NSPoint(x: c.x + dx, y: c.y), modifierFlags: [], timestamp: ProcessInfo.processInfo.systemUptime,
                                             windowNumber: w.windowNumber, context: nil, eventNumber: 0, clickCount: 1, pressure: 1)!
                      }
                      cad.mouseDown(with: ev(.leftMouseDown, 0))
                      for k in 1...6 { cad.mouseDragged(with: ev(.leftMouseDragged, CGFloat(k) * 4)); pump(0.05) }
                      cad.mouseUp(with: ev(.leftMouseUp, 24))
                      pump(1.5)
                  }

                  lib.rebuildScene()
                  show()
                  state("1 empty window")
                  let before = spy?.frames ?? 0
                  lib.open(url)
                  settle()
                  state("2 file opened in the running window")
                  print("   frames drawn after open: \((spy?.frames ?? 0) - before)")
                  drag()
                  state("3 after a mouse drag on the 3D view")

                  window?.orderOut(nil)
                  window = nil
                  spy = nil
                  lib.dirty = false
                  lib.newDocument()
                  pump(1)
                  lib.open(url)
                  show()
                  settle()
                  state("4 file opened before the window existed")
                  drag()
                  state("5 after a mouse drag")
                  return true
              }
          }
          #endif
          SWIFT
          SDK="$(ls -d /Library/Developer/CommandLineTools/SDKs/MacOSX26*.sdk | tail -1)"
          OCCT="$PWD/Vendor/occt"
          LIBS=(); for f in "$OCCT"/lib/*.a; do LIBS+=(-Xlinker "$f"); done
          swiftc -O -swift-version 5 -parse-as-library -sdk "$SDK" -target arm64-apple-macos26.0 -D SELFTEST -import-objc-header BcadKernel.h \
            Bcad.swift Design.swift Viewport.swift Views.swift Files.swift "$W/ViewProbe.swift" "$W/k.o" "${LIBS[@]}" -lc++ -o "$W/viewprobe"
          SHOTS="$RUNNER_TEMP/results/shots" APP_STRINGS="$PWD/i18n.json" perl -e 'alarm 900; exec @ARGV' "$W/viewprobe" --selftest "$TMPDIR/bcad-selftest/test.3mf" 2>&1 | tee "$RUNNER_TEMP/results/viewprobe.log"

      - name: Thumbnails
        if: always()
        continue-on-error: true
        run: |
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/results/shots/*.png; do
            sips -Z 900 -s format jpeg -s formatOptions 45 "$f" --out "${f%.png}.jpg" >/dev/null
            echo "=== THUMB $(basename "${f%.png}") ==="
            base64 -i "${f%.png}.jpg" | tr -d '\n'
            echo
            echo "=== END ==="
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Bcad.app
          path: ${{ runner.temp }}/out/Bcad.app.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            ${{ runner.temp }}/results
            ${{ runner.temp }}/tmp/bcad-selftest
