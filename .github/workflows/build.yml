name: build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          sw_vers
          sysctl -n machdep.cpu.brand_string hw.ncpu
          xcode-select -p
          xcrun --sdk macosx --show-sdk-path
          swiftc --version
          clang++ --version

      - name: Engine test
        run: |
          start=$(date +%s)
          ./test/engine.sh
          echo "engine test took $(( $(date +%s) - start )) s"

      - name: Corpus
        run: |
          mkdir -p "$RUNNER_TEMP/digest"
          start=$(date +%s)
          ./test/corpus.sh --digest "$RUNNER_TEMP/digest/mac.txt"
          echo "corpus took $(( $(date +%s) - start )) s"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digest-mac
          path: ${{ runner.temp }}/digest/mac.txt

      - name: Self-test
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          start=$(date +%s)
          ./test/selftest.sh 2>&1 | tee "$RUNNER_TEMP/results/selftest.log"
          echo "self-test took $(( $(date +%s) - start )) s"

      - name: Print files as slicers read them
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q lib3mf trimesh numpy
          "$RUNNER_TEMP/venv/bin/python" test/printcheck.py "$TMPDIR/bcad-selftest/print-samples"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: print-samples
          path: ${{ runner.temp }}/tmp/bcad-selftest/print-samples

      - name: Build the apps (for you, and for the App Store)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          start=$(date +%s)
          ./build.sh --personal "$RUNNER_TEMP/out/personal/Bcad.app"
          ./build.sh --appstore "$RUNNER_TEMP/out/appstore/Bcad.app"
          echo "builds took $(( $(date +%s) - start )) s"
          fail=0
          for m in personal appstore; do
            A="$RUNNER_TEMP/out/$m/Bcad.app"
            du -sh "$A"
            if [ -e "$A/Contents/Frameworks" ]; then echo "✗ $m: libraries bundled"; fail=1; fi
            codesign --verify --strict "$A" && echo "✓ $m: signature ok" || fail=1
            plutil -p "$A/Contents/Info.plist" | grep -E "CFBundleIdentifier|CFBundleShortVersionString|CFBundleVersion|NSHumanReadableCopyright"
          done
          A="$RUNNER_TEMP/out/appstore/Bcad.app"
          codesign -d --entitlements - --xml "$A" 2>/dev/null | plutil -p - | tee "$RUNNER_TEMP/entitlements.txt"
          grep -q '"com.apple.security.app-sandbox" => true' "$RUNNER_TEMP/entitlements.txt" && echo "✓ sandboxed" || { echo "✗ not sandboxed"; fail=1; }
          codesign -dv "$A" 2>&1 | grep -q "runtime" && echo "✓ hardened runtime" || { echo "✗ no hardened runtime"; fail=1; }
          plutil -lint "$A/Contents/Resources/PrivacyInfo.xcprivacy" && echo "✓ privacy manifest" || fail=1
          [ ! -e "$A/Contents/Resources/Bcad.storekit" ] && echo "✓ no test store inside" || { echo "✗ test store bundled"; fail=1; }
          exit $fail

      - name: Launch and open a file (the App Store app in its sandbox, saving back; the app for you)
        run: |
          FILE="$TMPDIR/bcad-selftest/test.3mf"
          fail=0
          test/launch.sh "$RUNNER_TEMP/out/appstore/Bcad.app" "$FILE" "$RUNNER_TEMP/results" appstore save || fail=1
          test/launch.sh "$RUNNER_TEMP/out/personal/Bcad.app" "$FILE" "$RUNNER_TEMP/results" personal || fail=1
          exit $fail

      - name: Thumbnails
        if: always()
        continue-on-error: true
        run: |
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/results/*/shots/*.png; do
            sips -Z 900 -s format jpeg -s formatOptions 45 "$f" --out "${f%.png}.jpg" >/dev/null
            echo "=== THUMB $(basename "${f%.png}") ==="
            base64 -i "${f%.png}.jpg" | tr -d '\n'
            echo
            echo "=== END ==="
          done

      - name: Xcode project for the App Store (made and built, unsigned)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          brew install xcodegen
          appstore/prepare.sh "$RUNNER_TEMP/out/personal/Bcad.app/Contents/MacOS/Bcad"
          start=$(date +%s)
          xcodebuild -project appstore/Bcad.xcodeproj -scheme Bcad -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/xcode" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/results/xcodebuild.log" 2>&1 \
            || { tail -80 "$RUNNER_TEMP/results/xcodebuild.log"; exit 1; }
          echo "xcodebuild took $(( $(date +%s) - start )) s"
          grep -E "warning:|BUILD" "$RUNNER_TEMP/results/xcodebuild.log" | sort -u | tail -40
          X="$RUNNER_TEMP/xcode/Build/Products/Release/Bcad.app"
          lipo -archs "$X/Contents/MacOS/Bcad"
          lipo -archs "$X/Contents/MacOS/Bcad" | grep -q arm64 && lipo -archs "$X/Contents/MacOS/Bcad" | grep -q x86_64 && echo "✓ Apple silicon and Intel"
          ls "$X/Contents/Resources" | head -40

      - name: Packages to download
        run: |
          OUT="$RUNNER_TEMP/out"
          ditto -c -k --keepParent "$OUT/personal/Bcad.app" "$OUT/Bcad-for-me.zip"
          P="$OUT/Bcad-for-App-Store"
          mkdir -p "$P/Bcad source"
          git archive --format=tar HEAD | tar -x -C "$P/Bcad source"
          cp -R appstore/Bcad.xcodeproj appstore/Resources appstore/Info.plist "$P/Bcad source/appstore/"
          cp appstore/README.md "$P/HOW TO PUBLISH.md"
          ditto "$OUT/appstore/Bcad.app" "$P/Bcad.app"
          ditto -c -k --keepParent "$P" "$OUT/Bcad-for-App-Store.zip"
          ls -la "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Bcad-for-me
          path: ${{ runner.temp }}/out/Bcad-for-me.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Bcad-for-App-Store
          path: ${{ runner.temp }}/out/Bcad-for-App-Store.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            ${{ runner.temp }}/results
            ${{ runner.temp }}/tmp/bcad-selftest

  # Real slicers open the print samples (Bambu Studio, PrusaSlicer, Cura's engine): not yet gating.
  slicers:
    needs: mac
    runs-on: macos-26
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: print-samples
          path: samples
      - name: Slicers open the samples
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./test/slicers.sh samples

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Engine test
        run: bash test/engine.sh

      - name: Corpus
        run: |
          mkdir -p "$RUNNER_TEMP/digest"
          ./test/corpus.sh --digest "$RUNNER_TEMP/digest/linux.txt"

      - name: Corpus, each case moved, turned, scaled and reordered
        run: ./test/corpus.sh --perturb | grep -v "^WRONG" | tail -60

      - name: Translations
        run: python3 test/i18n.py

      - name: Engine test under the address and undefined-behaviour sanitizers
        run: |
          export ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 BCAD_UNTIMED=1
          c++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined -ffp-contract=off -I. \
            test/engine.cpp Engine/*.cpp -o "$RUNNER_TEMP/engine-asan"
          "$RUNNER_TEMP/engine-asan" | grep -vE "^✓" | tail -60

      - name: Corpus under the address and undefined-behaviour sanitizers
        run: |
          # A sanitizer's finding ends the run with 86; any case not as expected, open or not printable with 1: both fail it.
          export ASAN_OPTIONS=detect_leaks=0:exitcode=86 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1:exitcode=86
          set +e
          CORPUS_FLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" ./test/corpus.sh > "$RUNNER_TEMP/asan.txt" 2>&1
          code=$?
          tail -40 "$RUNNER_TEMP/asan.txt"
          [ $code -eq 0 ]

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digest-linux
          path: ${{ runner.temp }}/digest/linux.txt

  compare:
    needs: [mac, linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digest
      - name: The same results on macOS and Linux
        run: |
          ls -la digest
          if diff digest/mac.txt digest/linux.txt > digest/diff.txt; then echo "macOS and Linux agree on every case"; else echo "$(grep -c '^<' digest/diff.txt) lines differ:"; head -80 digest/diff.txt; exit 1; fi
