name: build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          sw_vers
          sysctl -n machdep.cpu.brand_string hw.ncpu
          xcode-select -p
          xcrun --sdk macosx --show-sdk-path
          swiftc --version
          clang++ --version

      - name: Restore OpenCascade
        id: occt
        uses: actions/cache/restore@v4
        with:
          path: Vendor/occt
          key: occt-${{ runner.arch }}-${{ hashFiles('occt.sh') }}
          restore-keys: occt-${{ runner.arch }}-

      - name: Build OpenCascade
        run: |
          start=$(date +%s)
          ./occt.sh
          echo "occt.sh took $(( $(date +%s) - start )) s"

      - name: Save OpenCascade
        if: steps.occt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Vendor/occt
          key: occt-${{ runner.arch }}-${{ hashFiles('occt.sh') }}

      - name: Self-test
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          start=$(date +%s)
          ./test/selftest.sh 2>&1 | tee "$RUNNER_TEMP/results/selftest.log"
          echo "self-test took $(( $(date +%s) - start )) s"

      - name: Build app
        run: |
          start=$(date +%s)
          ./build.sh "$RUNNER_TEMP/out/Bcad.app"
          echo "build took $(( $(date +%s) - start )) s"
          ls -la "$RUNNER_TEMP/out/Bcad.app/Contents" "$RUNNER_TEMP/out/Bcad.app/Contents/MacOS"
          codesign -dv "$RUNNER_TEMP/out/Bcad.app" 2>&1 || true
          codesign --verify --strict "$RUNNER_TEMP/out/Bcad.app" && echo "signature ok" || echo "signature NOT valid"
          ditto -c -k --keepParent "$RUNNER_TEMP/out/Bcad.app" "$RUNNER_TEMP/out/Bcad.app.zip"

      - name: Launch and open a file
        continue-on-error: true
        run: |
          APP="$RUNNER_TEMP/out/Bcad.app"
          FILE="$TMPDIR/bcad-selftest/test.3mf"
          R="$RUNNER_TEMP/results"
          mkdir -p "$R/shots"
          ls -la "$FILE" || echo "no test.3mf from the self-test"
          snap() {
            sleep "$2"
            screencapture -x "$R/shots/$1.png" || echo "screencapture failed"
            if pgrep -x Bcad >/dev/null; then echo "$1: Bcad running"; else echo "$1: Bcad NOT running"; fi
          }
          quit() {
            pkill -TERM -x Bcad || true
            for i in $(seq 1 50); do pgrep -x Bcad >/dev/null || break; sleep 0.2; done
            pkill -KILL -x Bcad 2>/dev/null || true
          }

          echo "▸ 1 launch empty"
          open --stdout "$R/1.out" --stderr "$R/1.err" "$APP"
          snap 1-empty 15

          echo "▸ 2 open the file in the running app"
          open -a "$APP" "$FILE"
          snap 2-open-running-10s 10
          snap 2-open-running-40s 30
          quit

          echo "▸ 3 cold launch with the file (Finder double-click)"
          open -a "$APP" --stdout "$R/3.out" --stderr "$R/3.err" "$FILE"
          snap 3-cold-10s 10
          snap 3-cold-40s 30

          echo "▸ 4 open the same file again"
          open -a "$APP" "$FILE"
          snap 4-reopen-30s 30
          quit

          log show --last 15m --style compact --predicate 'process == "Bcad"' > "$R/unified.log" 2>&1 || true
          tail -100 "$R/unified.log"
          mkdir -p "$R/crashes"
          cp ~/Library/Logs/DiagnosticReports/*Bcad* "$R/crashes/" 2>/dev/null || echo "no crash reports"
          ls -la "$R" "$R/shots" "$R/crashes"
          for f in "$R"/*.out "$R"/*.err; do echo "── $f"; cat "$f"; done

      - name: Use the real app
        continue-on-error: true
        run: |
          # Temporary: real mouse and keyboard events on the real app, controls found by their accessibility names.
          # The document renamed, a raised cube turned, the split plane, bolt heads and nuts, a hot start.
          R="$RUNNER_TEMP/results"
          APP="$RUNNER_TEMP/out/Bcad.app"
          mkdir -p "$R/shots"
          cat > "$RUNNER_TEMP/ui.swift" <<'SWIFT'
          import AppKit
          import ApplicationServices

          let a = Array(CommandLine.arguments.dropFirst())
          guard let app = NSRunningApplication.runningApplications(withBundleIdentifier: "local.bohdan.bcad").first else { print("Bcad isn't running"); exit(1) }
          let pid = app.processIdentifier
          let root = AXUIElementCreateApplication(pid)

          func value(_ e: AXUIElement, _ name: String) -> CFTypeRef? {
              var v: CFTypeRef?
              return AXUIElementCopyAttributeValue(e, name as CFString, &v) == .success ? v : nil
          }
          func texts(_ e: AXUIElement) -> [String] { [kAXDescriptionAttribute, kAXTitleAttribute, kAXValueAttribute].compactMap { value(e, $0) as? String } }
          func kids(_ e: AXUIElement) -> [AXUIElement] { (value(e, kAXChildrenAttribute) as? [AXUIElement]) ?? [] }
          func frame(_ e: AXUIElement) -> CGRect? {
              guard let p = value(e, kAXPositionAttribute), let s = value(e, kAXSizeAttribute) else { return nil }
              var pt = CGPoint.zero, sz = CGSize.zero
              AXValueGetValue(p as! AXValue, .cgPoint, &pt)
              AXValueGetValue(s as! AXValue, .cgSize, &sz)
              return CGRect(origin: pt, size: sz)
          }
          func all(_ e: AXUIElement, _ depth: Int = 0) -> [(AXUIElement, Int)] { depth > 60 ? [] : [(e, depth)] + kids(e).flatMap { all($0, depth + 1) } }
          func find(_ label: String, _ n: Int) -> CGRect? {
              let hits = all(root).filter { texts($0.0).contains(label) }.compactMap { frame($0.0) }.filter { $0.width > 0 && $0.height > 0 }
              return hits.count >= n ? hits[n - 1] : nil
          }
          func window() -> CGRect {
              let list = CGWindowListCopyWindowInfo([.optionOnScreenOnly], kCGNullWindowID) as? [[String: Any]] ?? []
              for w in list where (w[kCGWindowOwnerPID as String] as? Int32) == pid && (w[kCGWindowLayer as String] as? Int) == 0 {
                  if let b = w[kCGWindowBounds as String], let r = CGRect(dictionaryRepresentation: b as! CFDictionary), r.width > 300 { return r }
              }
              return .zero
          }
          // The 3D view's middle: the window right of the 320-point side panel.
          func middle() -> CGPoint { let w = window(); return CGPoint(x: w.minX + 320 + (w.width - 320) / 2, y: w.midY) }
          func post(_ type: CGEventType, _ p: CGPoint, _ flags: CGEventFlags = []) {
              let e = CGEvent(mouseEventSource: nil, mouseType: type, mouseCursorPosition: p, mouseButton: .left)
              e?.flags = flags
              e?.post(tap: .cghidEventTap)
              usleep(25_000)
          }
          func click(_ p: CGPoint) {
              post(.mouseMoved, p)
              usleep(120_000)
              post(.leftMouseDown, p)
              post(.leftMouseUp, p)
          }
          func drag(_ from: CGPoint, _ to: CGPoint, _ flags: CGEventFlags = []) {
              post(.mouseMoved, from)
              usleep(120_000)
              post(.leftMouseDown, from, flags)
              for k in 1...24 { post(.leftMouseDragged, CGPoint(x: from.x + (to.x - from.x) * CGFloat(k) / 24, y: from.y + (to.y - from.y) * CGFloat(k) / 24), flags) }
              post(.leftMouseUp, to, flags)
          }
          func flags(_ s: String?) -> CGEventFlags { ["option": .maskAlternate, "shift": .maskShift, "cmd": .maskCommand][s ?? ""] ?? [] }

          // Bcad in front first: a click on a window in the background only brings it forward.
          if !["trusted", "tree"].contains(a[0]) {
              app.activate()
              usleep(400_000)
          }
          switch a[0] {
          case "trusted":
              print("accessibility trusted: \(AXIsProcessTrusted()) · window \(window())")
          case "tree":
              for (e, d) in all(root) where !texts(e).isEmpty { print(String(repeating: " ", count: d), texts(e).joined(separator: " | "), frame(e).map { "\($0)" } ?? "") }
          case "axpress":
              let hit = all(root).first { texts($0.0).contains(a[1]) }
              print("axpress \(a[1]):", hit.map { AXUIElementPerformAction($0.0, kAXPressAction as CFString).rawValue } ?? -1)
          case "count":
              print("shapes listed:", all(root).filter { (value($0.0, kAXRoleAttribute) as? String) == "AXStaticText" && texts($0.0).contains(a[1]) }.count)
          case "hold":
              // A press held for a while, at a spot in the element (fractions of its size).
              guard let r = find(a[1], 1) else { print("✗ no \(a[1])"); exit(0) }
              let p = CGPoint(x: r.minX + r.width * CGFloat(Double(a[2])!), y: r.minY + r.height * CGFloat(Double(a[3])!))
              post(.mouseMoved, p)
              usleep(600_000)
              post(.leftMouseDown, p)
              usleep(UInt32(Int(a[4])!) * 1000)
              post(.leftMouseUp, p)
              print("held \(a[1]) at \(p)")
          case "press":
              guard let r = find(a[1], a.count > 2 ? Int(a[2])! : 1) else { print("✗ no \(a[1])"); exit(0) }
              var under: AXUIElement?
              AXUIElementCopyElementAtPosition(root, Float(r.midX), Float(r.midY), &under)
              click(CGPoint(x: r.midX, y: r.midY))
              print("pressed \(a[1]) at \(r), under the pointer: \(under.map { texts($0) + [(value($0, kAXRoleAttribute) as? String) ?? ""] } ?? [])")
          case "slide":
              guard let r = find(a[1], 1) else { print("✗ no \(a[1])"); exit(0) }
              drag(CGPoint(x: r.midX, y: r.midY), CGPoint(x: r.minX + r.width * CGFloat(Double(a[2])!), y: r.midY))
              print("slid \(a[1]) in \(r)")
          case "click":
              click(CGPoint(x: Double(a[1])!, y: Double(a[2])!))
          case "dclick":
              // A double click on the element: the second press carries click count 2.
              guard let r = find(a[1], 1) else { print("✗ no \(a[1])"); exit(0) }
              let p = CGPoint(x: r.midX, y: r.midY)
              post(.mouseMoved, p)
              usleep(150_000)
              for n in [1, 2] {
                  for t in [CGEventType.leftMouseDown, .leftMouseUp] {
                      let e = CGEvent(mouseEventSource: nil, mouseType: t, mouseCursorPosition: p, mouseButton: .left)
                      e?.setIntegerValueField(.mouseEventClickState, value: Int64(n))
                      e?.post(tap: .cghidEventTap)
                      usleep(30_000)
                  }
              }
              print("double-clicked \(a[1]) at \(p)")
          case "type":
              for ch in a[1] {
                  for down in [true, false] {
                      let e = CGEvent(keyboardEventSource: nil, virtualKey: 0, keyDown: down)
                      var u = Array(String(ch).utf16)
                      e?.keyboardSetUnicodeString(stringLength: u.count, unicodeString: &u)
                      e?.post(tap: .cghidEventTap)
                      usleep(30_000)
                  }
              }
              print("typed \(a[1])")
          case "pressr":
              // Like press, among the controls at the window's right side (the inspector).
              let w = window()
              let hits = all(root).filter { texts($0.0).contains(a[1]) }.compactMap { frame($0.0) }.filter { $0.width > 0 && $0.height > 0 && $0.minX > w.maxX - 340 }
              let n = a.count > 2 ? Int(a[2])! : 1
              guard hits.count >= n else { print("✗ no \(a[1]) on the right"); exit(0) }
              click(CGPoint(x: hits[n - 1].midX, y: hits[n - 1].midY))
              print("pressed \(a[1]) at \(hits[n - 1])")
          case "viewarc":
              // A drag along an arc round the 3D view's middle: from radius r (a fraction of the window's height) at angle 0,
              // turning by the given degrees.
              let m = middle(), r = window().height * CGFloat(Double(a[1])!), turn = Double(a[2])! * .pi / 180
              let start = CGPoint(x: m.x + r, y: m.y)
              post(.mouseMoved, start)
              usleep(150_000)
              post(.leftMouseDown, start)
              for k in 1...24 {
                  let t = turn * Double(k) / 24
                  post(.leftMouseDragged, CGPoint(x: m.x + r * CGFloat(cos(t)), y: m.y - r * CGFloat(sin(t))))
              }
              post(.leftMouseUp, CGPoint(x: m.x + r * CGFloat(cos(turn)), y: m.y - r * CGFloat(sin(turn))))
              print("arc at \(r) by \(a[2])°")
          case "view":
              let m = middle()
              click(CGPoint(x: m.x + CGFloat(Double(a[1])!), y: m.y + CGFloat(Double(a[2])!)))
          case "viewdrag":
              let m = middle()
              drag(CGPoint(x: m.x + CGFloat(Double(a[1])!), y: m.y + CGFloat(Double(a[2])!)), CGPoint(x: m.x + CGFloat(Double(a[3])!), y: m.y + CGFloat(Double(a[4])!)),
                   flags(a.count > 5 ? a[5] : nil))
          default:
              for down in [true, false] {
                  let e = CGEvent(keyboardEventSource: nil, virtualKey: CGKeyCode(Int(a[1])!), keyDown: down)
                  e?.flags = flags(a.count > 2 ? a[2] : nil)
                  e?.post(tap: .cghidEventTap)
                  usleep(40_000)
              }
          }
          SWIFT
          swiftc -O "$RUNNER_TEMP/ui.swift" -o "$RUNNER_TEMP/ui"
          U="$RUNNER_TEMP/ui"
          shot() { sleep "${2:-2}"; screencapture -x "$R/shots/$1.png"; pgrep -x Bcad >/dev/null && echo "$1: running" || echo "$1: NOT running"; }
          crashes() { ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -c '^Bcad' || true; }
          before=$(crashes)
          pkill -x Bcad || true
          sleep 2
          rm -rf "$HOME/Library/Application Support/Bcad"
          defaults write com.apple.dock autohide -bool true && killall Dock && sleep 3
          echo "— cold start"
          open -a "$APP"
          shot ui-00-cold 12
          $U trusted
          echo "— the document renamed in the window: double-click, type, Enter"
          $U dclick Untitled; sleep 1
          shot ui-01-editing 0
          $U type "Bracket"; sleep 0.5; $U key 36; sleep 1
          shot ui-02-renamed 0
          $U tree | grep -iE "bracket|untitled" | head -5
          echo "— a raised cube turned with a ring stays up"
          $U hold Cube 0.5 0.5 60; sleep 3
          for i in 1 2 3; do $U key 116 shift; sleep 0.5; done
          sleep 1; $U key 3; sleep 2
          $U key 17; sleep 1
          shot ui-03-rings 1
          for r in 0.15 0.16 0.17 0.14 0.18; do $U viewarc $r 40; sleep 1; $U tree | grep -E "Size  " | head -1; done
          sleep 2
          shot ui-04-turned 0
          $U key 5; sleep 1
          $U tree | grep -iE "size  |mm" | head -12
          shot ui-05-move-tab 0
          echo "— the split plane over the raised, turned cube"
          $U key 1; sleep 2
          shot ui-06-split 0
          $U key 53; sleep 1
          echo "— Thread: a bolt, its heads, then nuts"
          $U key 51; sleep 1
          $U key 11 cmd; sleep 8
          shot ui-07-bolt 0
          $U pressr Move; sleep 1; $U pressr Thread; sleep 1
          shot ui-07-tabs 0
          $U pressr Head; sleep 1
          shot ui-08-heads 0
          $U pressr Head; sleep 1
          for head in "Hex socket" "PH · hex · cone below" "12-point" "Torx · countersunk"; do
            $U pressr Head; sleep 1
            $U pressr "$head"; sleep 10
            shot "ui-09-$(echo $head | tr -cd 'A-Za-z0-9')" 0
          done
          $U pressr T40; sleep 8
          shot ui-09-T40 0
          $U tree | grep -iE "torx|T40|head|countersunk" | head -10
          $U pressr Nut; sleep 8
          shot ui-10-nut 0
          $U pressr Nut 2; sleep 1
          shot ui-11-nuts 0
          $U pressr Cone; sleep 8
          shot ui-12-cone-nut 0
          $U pressr Nut 2; sleep 1
          $U pressr Square; sleep 8
          shot ui-13-square-nut 0
          $U tree | grep -iE "nut sizes|across flats|cone|square|head" | head -12
          $U key 12 cmd; shot ui-14-quit 2
          $U press "Don't Save"; sleep 3
          pkill -x Bcad || true
          sleep 3
          open -a "$APP"
          shot ui-15-hot 8
          pkill -x Bcad || true
          sleep 5
          echo "new Bcad crash reports: $(( $(crashes) - before ))"
          mkdir -p "$R/crashes"
          cp ~/Library/Logs/DiagnosticReports/Bcad* "$R/crashes/" 2>/dev/null || true

      - name: Thumbnails
        if: always()
        continue-on-error: true
        run: |
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/results/shots/*.png; do
            sips -Z 900 -s format jpeg -s formatOptions 45 "$f" --out "${f%.png}.jpg" >/dev/null
            echo "=== THUMB $(basename "${f%.png}") ==="
            base64 -i "${f%.png}.jpg" | tr -d '\n'
            echo
            echo "=== END ==="
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Bcad.app
          path: ${{ runner.temp }}/out/Bcad.app.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            ${{ runner.temp }}/results
            ${{ runner.temp }}/tmp/bcad-selftest
