name: build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          sw_vers
          sysctl -n machdep.cpu.brand_string hw.ncpu
          xcode-select -p
          xcrun --sdk macosx --show-sdk-path
          swiftc --version
          clang++ --version

      - name: Restore OpenCascade
        id: occt
        uses: actions/cache/restore@v4
        with:
          path: Vendor/occt
          key: occt-${{ runner.arch }}-${{ hashFiles('occt.sh') }}
          restore-keys: occt-${{ runner.arch }}-

      - name: Build OpenCascade
        run: |
          start=$(date +%s)
          ./occt.sh
          echo "occt.sh took $(( $(date +%s) - start )) s"

      - name: Save OpenCascade
        if: steps.occt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Vendor/occt
          key: occt-${{ runner.arch }}-${{ hashFiles('occt.sh') }}

      - name: Self-test
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          start=$(date +%s)
          ./test/selftest.sh 2>&1 | tee "$RUNNER_TEMP/results/selftest.log"
          echo "self-test took $(( $(date +%s) - start )) s"

      - name: Build app
        run: |
          start=$(date +%s)
          ./build.sh "$RUNNER_TEMP/out/Bcad.app"
          echo "build took $(( $(date +%s) - start )) s"
          ls -la "$RUNNER_TEMP/out/Bcad.app/Contents" "$RUNNER_TEMP/out/Bcad.app/Contents/MacOS"
          codesign -dv "$RUNNER_TEMP/out/Bcad.app" 2>&1 || true
          codesign --verify --strict "$RUNNER_TEMP/out/Bcad.app" && echo "signature ok" || echo "signature NOT valid"
          ditto -c -k --keepParent "$RUNNER_TEMP/out/Bcad.app" "$RUNNER_TEMP/out/Bcad.app.zip"

      - name: Launch and open a file
        continue-on-error: true
        run: |
          APP="$RUNNER_TEMP/out/Bcad.app"
          FILE="$TMPDIR/bcad-selftest/test.3mf"
          R="$RUNNER_TEMP/results"
          mkdir -p "$R/shots"
          ls -la "$FILE" || echo "no test.3mf from the self-test"
          snap() {
            sleep "$2"
            screencapture -x "$R/shots/$1.png" || echo "screencapture failed"
            if pgrep -x Bcad >/dev/null; then echo "$1: Bcad running"; else echo "$1: Bcad NOT running"; fi
          }
          quit() {
            pkill -TERM -x Bcad || true
            for i in $(seq 1 50); do pgrep -x Bcad >/dev/null || break; sleep 0.2; done
            pkill -KILL -x Bcad 2>/dev/null || true
          }

          echo "▸ 1 launch empty"
          open --stdout "$R/1.out" --stderr "$R/1.err" "$APP"
          snap 1-empty 15

          echo "▸ 2 open the file in the running app"
          open -a "$APP" "$FILE"
          snap 2-open-running-10s 10
          snap 2-open-running-40s 30
          quit

          echo "▸ 3 cold launch with the file (Finder double-click)"
          open -a "$APP" --stdout "$R/3.out" --stderr "$R/3.err" "$FILE"
          snap 3-cold-10s 10
          snap 3-cold-40s 30

          echo "▸ 4 open the same file again"
          open -a "$APP" "$FILE"
          snap 4-reopen-30s 30
          quit

          log show --last 15m --style compact --predicate 'process == "Bcad"' > "$R/unified.log" 2>&1 || true
          tail -100 "$R/unified.log"
          mkdir -p "$R/crashes"
          cp ~/Library/Logs/DiagnosticReports/*Bcad* "$R/crashes/" 2>/dev/null || echo "no crash reports"
          ls -la "$R" "$R/shots" "$R/crashes"
          for f in "$R"/*.out "$R"/*.err; do echo "── $f"; cat "$f"; done

      - name: Verify the 3D view after a Finder-style open
        continue-on-error: true
        run: |
          # Temporary check: the real app with a frame counter on its 3D view, launched with the file as a double-click
          # does, then an orbit drag on empty space. Expect frames before and more frames after the drag.
          W="$RUNNER_TEMP/probe"
          R="$RUNNER_TEMP/results"
          FILE="$TMPDIR/bcad-selftest/test.3mf"
          mkdir -p "$W"
          cat > "$W/LSProbe.swift" <<'SWIFT'
          #if SELFTEST
          import AppKit
          import MetalKit

          @MainActor
          final class Spy: NSObject, MTKViewDelegate {
              let inner: Renderer
              var frames = 0
              init(_ r: Renderer) { inner = r }
              nonisolated func mtkView(_ view: MTKView, drawableSizeWillChange size: CGSize) {}
              nonisolated func draw(in view: MTKView) {
                  MainActor.assumeIsolated { frames += 1 }
                  inner.draw(in: view)
              }
          }

          @MainActor
          enum SelfTest {
              static var spy: Spy?

              static func run(_ url: URL) -> Bool {
                  setvbuf(stdout, nil, _IONBF, 0)
                  let lib = Workbench.shared
                  func find(_ v: NSView) -> CadView? { (v as? CadView) ?? v.subviews.lazy.compactMap(find).first }
                  func cad() -> CadView? { NSApp.windows.lazy.compactMap { $0.contentView.flatMap(find) }.first }
                  func state(_ title: String) {
                      print("== \(title): frames \(spy?.frames ?? -1) · bodies \(lib.doc.bodies.count), meshes \(lib.meshes.count) · requestFit \(lib.requestFit) · yaw \(lib.camera.yaw)")
                  }
                  func at(_ t: Double, _ f: @escaping @MainActor () -> Void) {
                      DispatchQueue.main.asyncAfter(deadline: .now() + t) { MainActor.assumeIsolated { f() } }
                  }
                  at(4) {
                      guard let v = cad() else { print("✗ no 3D view"); return }
                      let s = Spy(v.renderer)
                      v.delegate = s
                      spy = s
                      state("1 four seconds after launch (counting starts)")
                      lib.sceneVersion += 1
                  }
                  at(8) { state("2 after one change to the scene") }
                  at(9) {
                      guard let v = cad(), let w = v.window else { return }
                      let start = v.convert(NSPoint(x: v.bounds.maxX - 60, y: v.bounds.minY + 60), to: nil)
                      func ev(_ t: NSEvent.EventType, _ dx: CGFloat) -> NSEvent {
                          NSEvent.mouseEvent(with: t, location: NSPoint(x: start.x + dx, y: start.y), modifierFlags: [], timestamp: ProcessInfo.processInfo.systemUptime,
                                             windowNumber: w.windowNumber, context: nil, eventNumber: 0, clickCount: 1, pressure: 1)!
                      }
                      v.mouseDown(with: ev(.leftMouseDown, 0))
                      for k in 1...6 { v.mouseDragged(with: ev(.leftMouseDragged, -CGFloat(k) * 5)) }
                      v.mouseUp(with: ev(.leftMouseUp, -30))
                  }
                  at(11) { state("3 after an orbit drag") }
                  at(12) { exit(0) }
                  BcadApp.main()
                  return true
              }
          }
          #endif
          SWIFT
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          OCCT="$PWD/Vendor/occt"
          clang++ -O2 -std=c++17 -isysroot "$SDK" -target arm64-apple-macos26.0 -isystem "$OCCT/include/opencascade" -c BcadKernel.cpp -o "$W/k.o"
          LIBS=(); for f in "$OCCT"/lib/*.a; do LIBS+=(-Xlinker "$f"); done
          swiftc -O -swift-version 5 -parse-as-library -sdk "$SDK" -target arm64-apple-macos26.0 -D SELFTEST -import-objc-header BcadKernel.h \
            Bcad.swift Design.swift Viewport.swift Views.swift Files.swift "$W/LSProbe.swift" "$W/k.o" "${LIBS[@]}" -lc++ -o "$W/lsprobe"
          P="$RUNNER_TEMP/ProbeApp.app"
          rm -rf "$P"
          cp -R "$RUNNER_TEMP/out/Bcad.app" "$P"
          cp "$W/lsprobe" "$P/Contents/MacOS/Bcad"
          codesign --force -s - "$P"
          pkill -x Bcad || true
          sleep 2
          open -a "$P" --stdout "$R/verify.out" --stderr "$R/verify.err" "$FILE" --args --selftest "$FILE"
          sleep 6
          screencapture -x "$R/shots/verify-cold-6s.png"
          sleep 10
          grep -E '^(==|✗)' "$R/verify.out" || tail -20 "$R/verify.out" "$R/verify.err"
          pkill -x Bcad || true

      - name: Thumbnails
        if: always()
        continue-on-error: true
        run: |
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/results/shots/*.png; do
            sips -Z 900 -s format jpeg -s formatOptions 45 "$f" --out "${f%.png}.jpg" >/dev/null
            echo "=== THUMB $(basename "${f%.png}") ==="
            base64 -i "${f%.png}.jpg" | tr -d '\n'
            echo
            echo "=== END ==="
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Bcad.app
          path: ${{ runner.temp }}/out/Bcad.app.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            ${{ runner.temp }}/results
            ${{ runner.temp }}/tmp/bcad-selftest
