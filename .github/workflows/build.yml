name: build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          sw_vers
          sysctl -n machdep.cpu.brand_string hw.ncpu
          xcode-select -p
          xcrun --sdk macosx --show-sdk-path
          swiftc --version
          clang++ --version

      - name: Restore OpenCascade
        id: occt
        uses: actions/cache/restore@v4
        with:
          path: Vendor/occt
          key: occt-${{ runner.arch }}-${{ hashFiles('occt.sh') }}
          restore-keys: occt-${{ runner.arch }}-

      - name: Build OpenCascade
        run: |
          start=$(date +%s)
          ./occt.sh
          echo "occt.sh took $(( $(date +%s) - start )) s"

      - name: Save OpenCascade
        if: steps.occt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Vendor/occt
          key: occt-${{ runner.arch }}-${{ hashFiles('occt.sh') }}

      - name: Self-test
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          start=$(date +%s)
          ./test/selftest.sh 2>&1 | tee "$RUNNER_TEMP/results/selftest.log"
          echo "self-test took $(( $(date +%s) - start )) s"

      - name: Build app
        run: |
          start=$(date +%s)
          ./build.sh "$RUNNER_TEMP/out/Bcad.app"
          echo "build took $(( $(date +%s) - start )) s"
          ls -la "$RUNNER_TEMP/out/Bcad.app/Contents" "$RUNNER_TEMP/out/Bcad.app/Contents/MacOS"
          codesign -dv "$RUNNER_TEMP/out/Bcad.app" 2>&1 || true
          codesign --verify --strict "$RUNNER_TEMP/out/Bcad.app" && echo "signature ok" || echo "signature NOT valid"
          ditto -c -k --keepParent "$RUNNER_TEMP/out/Bcad.app" "$RUNNER_TEMP/out/Bcad.app.zip"

      - name: Launch and open a file
        continue-on-error: true
        run: |
          APP="$RUNNER_TEMP/out/Bcad.app"
          FILE="$TMPDIR/bcad-selftest/test.3mf"
          R="$RUNNER_TEMP/results"
          mkdir -p "$R/shots"
          ls -la "$FILE" || echo "no test.3mf from the self-test"
          snap() {
            sleep "$2"
            screencapture -x "$R/shots/$1.png" || echo "screencapture failed"
            if pgrep -x Bcad >/dev/null; then echo "$1: Bcad running"; else echo "$1: Bcad NOT running"; fi
          }
          quit() {
            pkill -TERM -x Bcad || true
            for i in $(seq 1 50); do pgrep -x Bcad >/dev/null || break; sleep 0.2; done
            pkill -KILL -x Bcad 2>/dev/null || true
          }

          echo "▸ 1 launch empty"
          open --stdout "$R/1.out" --stderr "$R/1.err" "$APP"
          snap 1-empty 15

          echo "▸ 2 open the file in the running app"
          open -a "$APP" "$FILE"
          snap 2-open-running-10s 10
          snap 2-open-running-40s 30
          quit

          echo "▸ 3 cold launch with the file (Finder double-click)"
          open -a "$APP" --stdout "$R/3.out" --stderr "$R/3.err" "$FILE"
          snap 3-cold-10s 10
          snap 3-cold-40s 30

          echo "▸ 4 open the same file again"
          open -a "$APP" "$FILE"
          snap 4-reopen-30s 30
          quit

          log show --last 15m --style compact --predicate 'process == "Bcad"' > "$R/unified.log" 2>&1 || true
          tail -100 "$R/unified.log"
          mkdir -p "$R/crashes"
          cp ~/Library/Logs/DiagnosticReports/*Bcad* "$R/crashes/" 2>/dev/null || echo "no crash reports"
          ls -la "$R" "$R/shots" "$R/crashes"
          for f in "$R"/*.out "$R"/*.err; do echo "── $f"; cat "$f"; done

      - name: Use the real app
        continue-on-error: true
        run: |
          # Temporary check with real mouse and keyboard events: open the file the Finder way, click and orbit, then quit
          # with ⌘Q while shapes are still building, and look for crash reports and where settings were written.
          R="$RUNNER_TEMP/results"
          APP="$RUNNER_TEMP/out/Bcad.app"
          FILE="$TMPDIR/bcad-selftest/test.3mf"
          cat > "$RUNNER_TEMP/input.swift" <<'SWIFT'
          import ApplicationServices
          import Foundation

          let a = CommandLine.arguments
          let screen = CGDisplayBounds(CGMainDisplayID())
          func at(_ fx: String, _ fy: String) -> CGPoint { CGPoint(x: screen.width * Double(fx)!, y: screen.height * Double(fy)!) }
          func post(_ type: CGEventType, _ p: CGPoint) {
              CGEvent(mouseEventSource: nil, mouseType: type, mouseCursorPosition: p, mouseButton: .left)?.post(tap: .cghidEventTap)
              usleep(30_000)
          }
          switch a[1] {
          case "quit":
              for down in [true, false] {
                  let e = CGEvent(keyboardEventSource: nil, virtualKey: 0x0C, keyDown: down)
                  e?.flags = .maskCommand
                  e?.postToPid(pid_t(a[2])!)
                  usleep(30_000)
              }
          case "click":
              let p = at(a[2], a[3])
              post(.mouseMoved, p)
              post(.leftMouseDown, p)
              post(.leftMouseUp, p)
          default:
              let p = at(a[2], a[3]), dx = screen.width * Double(a[4])!
              post(.mouseMoved, p)
              post(.leftMouseDown, p)
              for k in 1...24 { post(.leftMouseDragged, CGPoint(x: p.x + dx * Double(k) / 24, y: p.y)) }
              post(.leftMouseUp, CGPoint(x: p.x + dx, y: p.y))
          }
          SWIFT
          swiftc -O "$RUNNER_TEMP/input.swift" -o "$RUNNER_TEMP/input"
          I="$RUNNER_TEMP/input"
          crashes() { ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -c '^Bcad' || true; }
          before=$(crashes)
          pkill -x Bcad || true
          sleep 2
          open -a "$APP" "$FILE"
          sleep 2
          screencapture -x "$R/shots/use-0-two-seconds.png"
          sleep 10
          screencapture -x "$R/shots/use-1-opened.png"
          $I click 0.656 0.519
          sleep 2
          screencapture -x "$R/shots/use-2-clicked-the-cube.png"
          $I drag 0.45 0.74 0.15
          sleep 2
          screencapture -x "$R/shots/use-3-orbited.png"
          pkill -x Bcad || true
          sleep 2
          for d in 1 2 3; do
            open -a "$APP" "$FILE"
            sleep $d
            pid=$(pgrep -x Bcad | head -1 || true)
            [ -n "$pid" ] && $I quit "$pid"
            sleep 5
            if pgrep -x Bcad >/dev/null; then echo "⌘Q ${d}s after opening: still running"; pkill -x Bcad || true; sleep 2; else echo "⌘Q ${d}s after opening: quit"; fi
          done
          sleep 10
          echo "new Bcad crash reports: $(( $(crashes) - before ))"
          ls ~/Library/Logs/DiagnosticReports/ | grep '^Bcad' || true
          mkdir -p "$R/crashes"
          cp ~/Library/Logs/DiagnosticReports/Bcad* "$R/crashes/" 2>/dev/null || true
          ls -la "$HOME/Library/Application Support/Bcad" || echo "no settings folder"
          codesign --verify --strict "$APP" && echo "app signature still valid" || echo "app signature broken"

      - name: Thumbnails
        if: always()
        continue-on-error: true
        run: |
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/results/shots/*.png; do
            sips -Z 900 -s format jpeg -s formatOptions 45 "$f" --out "${f%.png}.jpg" >/dev/null
            echo "=== THUMB $(basename "${f%.png}") ==="
            base64 -i "${f%.png}.jpg" | tr -d '\n'
            echo
            echo "=== END ==="
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Bcad.app
          path: ${{ runner.temp }}/out/Bcad.app.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            ${{ runner.temp }}/results
            ${{ runner.temp }}/tmp/bcad-selftest
