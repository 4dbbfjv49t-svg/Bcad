name: build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          sw_vers
          sysctl -n machdep.cpu.brand_string hw.ncpu
          xcode-select -p
          xcrun --sdk macosx --show-sdk-path
          swiftc --version
          clang++ --version

      - name: Engine test
        run: |
          start=$(date +%s)
          ./test/engine.sh
          echo "engine test took $(( $(date +%s) - start )) s"

      - name: Corpus
        run: |
          mkdir -p "$RUNNER_TEMP/digest"
          start=$(date +%s)
          ./test/corpus.sh --digest "$RUNNER_TEMP/digest/mac.txt"
          echo "corpus took $(( $(date +%s) - start )) s"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digest-mac
          path: ${{ runner.temp }}/digest/mac.txt

      - name: Self-test
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          start=$(date +%s)
          ./test/selftest.sh 2>&1 | tee "$RUNNER_TEMP/results/selftest.log"
          echo "self-test took $(( $(date +%s) - start )) s"

      - name: Build app
        run: |
          start=$(date +%s)
          ./build.sh "$RUNNER_TEMP/out/Bcad.app"
          echo "build took $(( $(date +%s) - start )) s"
          du -sh "$RUNNER_TEMP/out/Bcad.app" "$RUNNER_TEMP/out/Bcad.app/Contents/MacOS/Bcad"
          ls -la "$RUNNER_TEMP/out/Bcad.app/Contents" "$RUNNER_TEMP/out/Bcad.app/Contents/MacOS"
          otool -L "$RUNNER_TEMP/out/Bcad.app/Contents/MacOS/Bcad"
          if [ -e "$RUNNER_TEMP/out/Bcad.app/Contents/Frameworks" ]; then echo "✗ libraries bundled"; exit 1; fi
          codesign -dv "$RUNNER_TEMP/out/Bcad.app" 2>&1 || true
          codesign --verify --strict "$RUNNER_TEMP/out/Bcad.app" && echo "signature ok"
          ditto -c -k --keepParent "$RUNNER_TEMP/out/Bcad.app" "$RUNNER_TEMP/out/Bcad.app.zip"

      - name: Launch and open a file
        continue-on-error: true
        run: |
          APP="$RUNNER_TEMP/out/Bcad.app"
          FILE="$TMPDIR/bcad-selftest/test.3mf"
          R="$RUNNER_TEMP/results"
          mkdir -p "$R/shots"
          ls -la "$FILE" || echo "no test.3mf from the self-test"
          snap() {
            sleep "$2"
            screencapture -x "$R/shots/$1.png" || echo "screencapture failed"
            if pgrep -x Bcad >/dev/null; then echo "$1: Bcad running"; else echo "$1: Bcad NOT running"; fi
          }
          quit() {
            pkill -TERM -x Bcad || true
            for i in $(seq 1 50); do pgrep -x Bcad >/dev/null || break; sleep 0.2; done
            pkill -KILL -x Bcad 2>/dev/null || true
          }

          echo "▸ 1 launch empty"
          open --stdout "$R/1.out" --stderr "$R/1.err" "$APP"
          snap 1-empty 15

          echo "▸ 2 open the file in the running app"
          open -a "$APP" "$FILE"
          snap 2-open-running-10s 10
          snap 2-open-running-40s 30
          quit

          echo "▸ 3 cold launch with the file (Finder double-click)"
          open -a "$APP" --stdout "$R/3.out" --stderr "$R/3.err" "$FILE"
          snap 3-cold-10s 10
          snap 3-cold-40s 30

          echo "▸ 4 open the same file again"
          open -a "$APP" "$FILE"
          snap 4-reopen-30s 30
          quit

          log show --last 15m --style compact --predicate 'process == "Bcad"' > "$R/unified.log" 2>&1 || true
          tail -100 "$R/unified.log"
          mkdir -p "$R/crashes"
          cp ~/Library/Logs/DiagnosticReports/*Bcad* "$R/crashes/" 2>/dev/null || echo "no crash reports"
          ls -la "$R" "$R/shots" "$R/crashes"
          for f in "$R"/*.out "$R"/*.err; do echo "── $f"; cat "$f"; done

      - name: Thumbnails
        if: always()
        continue-on-error: true
        run: |
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/results/shots/*.png; do
            sips -Z 900 -s format jpeg -s formatOptions 45 "$f" --out "${f%.png}.jpg" >/dev/null
            echo "=== THUMB $(basename "${f%.png}") ==="
            base64 -i "${f%.png}.jpg" | tr -d '\n'
            echo
            echo "=== END ==="
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Bcad.app
          path: ${{ runner.temp }}/out/Bcad.app.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            ${{ runner.temp }}/results
            ${{ runner.temp }}/tmp/bcad-selftest

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Engine test
        run: bash test/engine.sh

      - name: Corpus
        run: |
          mkdir -p "$RUNNER_TEMP/digest"
          ./test/corpus.sh --digest "$RUNNER_TEMP/digest/linux.txt"

      - name: Corpus, each case moved, turned, scaled and reordered
        continue-on-error: true
        run: ./test/corpus.sh --perturb | grep -v "^WRONG" | tail -60

      - name: Corpus under the address and undefined-behaviour sanitizers
        run: |
          # A sanitizer's finding ends the run with 86; cases not as expected (1) are the step above's to report.
          export ASAN_OPTIONS=detect_leaks=0:exitcode=86 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1:exitcode=86
          set +e
          CORPUS_FLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" ./test/corpus.sh > "$RUNNER_TEMP/asan.txt" 2>&1
          code=$?
          tail -40 "$RUNNER_TEMP/asan.txt"
          [ $code -ne 86 ] && [ $code -le 1 ]

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digest-linux
          path: ${{ runner.temp }}/digest/linux.txt

  compare:
    needs: [mac, linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digest
      - name: The same results on macOS and Linux
        run: |
          ls -la digest
          if diff digest/mac.txt digest/linux.txt > digest/diff.txt; then echo "macOS and Linux agree on every case"; else echo "$(grep -c '^<' digest/diff.txt) lines differ:"; head -80 digest/diff.txt; exit 1; fi
